name: Deploy to InfinityFree

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️ Checkout source code
      - name: Get latest code
        uses: actions/checkout@v4

      # 2️ Setup PHP environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      # 3️ Cache Composer dependencies (giúp build nhanh hơn)
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # 4️ Install Composer packages
      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --no-interaction --prefer-dist

      # (Tuỳ chọn) Nếu CHẮC CHẮN config production ổn định
      # Nếu không chắc thì có thể bỏ 3 dòng này 
      # - name: Optimize Laravel
      #   run: |
      #     php artisan config:cache
      #     php artisan route:cache
      #     php artisan view:cache

      # 5️ Deploy to InfinityFree via FTP
      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /api-uniideas.wuaze.com/htdocs/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/.env