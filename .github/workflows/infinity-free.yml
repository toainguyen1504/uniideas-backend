name: Deploy to InfinityFree

# Run manually or on push to the main branch
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the latest code from GitHub
      - name: Get latest code
        uses: actions/checkout@v4

      # Step 2: Set up PHP environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # php-version: 8.4
          php-version: 8.2

      # Step 3: Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --no-interaction --prefer-dist
        # run: composer install --no-dev --optimize-autoloader

      # Step 4: Upload code via FTP
      - name: Deploy to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /api-uniideas.wuaze.com/htdocs/  # For addon domains
          exclude: |
            **/.git*
            **/node_modules/**
            **/tests/**
            **/.env
          # timeout: 86400000
          # log-level: standard
